# AetherCore Backend App Properties - Day 1
spring.application.name=backend-app
server.port=8080

# Flyway Database Migration Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Local / Lab default datasource (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/aethercore_lab
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Jackson Strict Deserialization (Reject unknown fields and decimal-to-int coercion)
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false

# Security JWT Trust Configuration
aethercore.security.jwt.issuer=https://auth.aethercore.com
aethercore.security.jwt.audience=aethercore
